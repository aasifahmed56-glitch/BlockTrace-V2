<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockTrace Verifier - Settings</title>
  <style>
    :root {
      --color-bg: #1B1310;
      --color-surface: #2B1D17;
      --color-surface-card: #231712;
      --color-border: #4A342B;
      --color-primary: #E0621A;
      --color-cream: #F7EFE8;
      --color-text-muted: #C9B8AF;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      background-color: var(--color-bg);
      color: var(--color-cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 24px;
      max-width: 500px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: var(--color-surface-card);
      border: 1px solid var(--color-border);
      color: var(--color-cream);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 8px;
    }
    input[readonly] {
      opacity: 0.85;
      cursor: default;
    }
    .btn {
      background-color: var(--color-primary);
      color: #FFF;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background-color: #F27228;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 4px;
    }
    .status-ok {
      background: #1B351E;
      color: #81C784;
      border: 1px solid #388E3C;
    }
    .status-err {
      background: #3E1616;
      color: #E57373;
      border: 1px solid #D32F2F;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(74, 52, 43, 0.4);
      font-size: 12px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      color: var(--color-text-muted);
    }
    .info-val {
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="28" height="28">
    <h1>BlockTrace Verifier - Settings</h1>
  </header>

  <div class="card">
    <label for="api-base-url">API Base URL (from package config)</label>
    <input type="text" id="api-base-url" readonly>

    <label for="web-url">Web Workspace URL</label>
    <input type="text" id="web-url" readonly>

    <button id="btn-test-connection" class="btn">Test Connection (/health)</button>
    <div id="connection-status" class="status-msg" style="display: none;"></div>
  </div>

  <div class="card">
    <div class="info-row">
      <span class="info-label">Extension Version</span>
      <span class="info-val" id="ext-version">1.0.0</span>
    </div>
    <div class="info-row">
      <span class="info-label">Manifest</span>
      <span class="info-val">V3</span>
    </div>
    <div class="info-row">
      <span class="info-label">Storage Permission</span>
      <span class="info-val">Active</span>
    </div>
    <div class="info-row">
      <span class="info-label">Context Menu</span>
      <span class="info-val">Active</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
